name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v3

    - name: Build APK
      run: |
        mkdir -p app/src/main/java/dz/tawdhif/app
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets
        find . -name "*.zip" -exec unzip -o {} \; 2>/dev/null || true
        find . -name "*.html" | head -1 | xargs -I{} cp {} app/src/main/assets/index.html 2>/dev/null || true
        [ ! -f app/src/main/assets/index.html ] && echo "<h1>تَوظِيف</h1>" > app/src/main/assets/index.html
        cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="dz.tawdhif.app">
        <uses-permission android:name="android.permission.INTERNET"/>
        <application android:label="تَوظِيف" android:hardwareAccelerated="true" android:usesCleartextTraffic="true">
        <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
        <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
        </activity></application></manifest>
        MANIFEST
        cat > app/src/main/java/dz/tawdhif/app/MainActivity.java << 'JAVA'
        package dz.tawdhif.app;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.*;
        public class MainActivity extends Activity {
            WebView w;
            public void onCreate(Bundle b) {
                super.onCreate(b);
                w = new WebView(this);
                w.getSettings().setJavaScriptEnabled(true);
                w.getSettings().setDomStorageEnabled(true);
                w.getSettings().setAllowFileAccess(true);
                w.getSettings().setAllowUniversalAccessFromFileURLs(true);
                w.setWebViewClient(new WebViewClient());
                setContentView(w);
                w.loadUrl("file:///android_asset/index.html");
            }
            public void onBackPressed() { if(w.canGoBack()) w.goBack(); else super.onBackPressed(); }
        }
        JAVA
        cat > app/src/main/res/values/strings.xml << 'XML'
        <?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">تَوظِيف</string></resources>
        XML
        cat > app/build.gradle << 'GRADLE'
        plugins { id 'com.android.application' }
        android {
            namespace 'dz.tawdhif.app'
            compileSdk 34
            defaultConfig { applicationId "dz.tawdhif.app"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
        }
        dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
        GRADLE
        cat > build.gradle << 'GRADLE'
        plugins { id 'com.android.application' version '8.2.0' apply false }
        GRADLE
        cat > settings.gradle << 'GRADLE'
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "tawdhif"
        include ':app'
        GRADLE
        mkdir -p gradle/wrapper
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" > gradle/wrapper/gradle-wrapper.properties
        gradle assembleDebug --no-daemon

    - uses: actions/upload-artifact@v4
      with:
        name: tawdhif-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
